name: mcp-publish

# Publish mcp/server.json to the official MCP registry
# (https://registry.modelcontextprotocol.io) as io.github.hail-hq/hail-mcp.
#
# Why a workflow and not `mcp-publisher login github` on a laptop: the
# registry grants the io.github.hail-hq/* namespace to org Owners only, read
# through GET /user/memberships/orgs. The token from the device-flow login
# does not see the hail-hq org (the org limits OAuth apps), so the publish
# gets 403 (seen 2026-10-18). GitHub OIDC grants io.github.<repo owner>/* from
# the repository_owner claim, so this job needs no token and no clicks.
#
# Runs on every merge to main that changes mcp/server.json. The registry
# refuses a version it already has, so bump "version" in the same PR.
# Also runnable by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths: ["mcp/server.json"]
  workflow_dispatch:

jobs:
  publish:
    # Only main may publish under the org namespace: a manual run from a
    # feature branch would otherwise ship that branch's server.json.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for the registry login
      contents: read
    defaults:
      run:
        working-directory: mcp
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      # sha256 of mcp-publisher_linux_amd64.tar.gz for that release.
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tgz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tgz" | sha256sum -c -
          tar xzf mcp-publisher.tgz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
